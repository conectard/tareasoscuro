/* ---------- Modo escritorio (widget) ---------- */
#tb,#qa{display:none}
html.desk,html.desk body{height:100%;overflow:hidden}
html.desk body{display:flex;flex-direction:column;background:#0b1119;min-height:0;user-select:none}
html.desk input{user-select:text}
html.desk #app{flex:1;min-height:0;width:100%;margin:0;overflow-y:auto;overscroll-behavior:contain;max-width:none;padding:2px 14px 14px}
html.desk.full #app{padding:14px 20px 130px}
html.desk.full #app>*{max-width:460px;margin-left:auto;margin-right:auto}
html.desk #tb{display:flex;align-items:center;gap:2px;height:40px;padding:0 6px 0 14px;flex:none;-webkit-app-region:drag;position:relative;z-index:50;background:#0b1119;border-bottom:1px solid var(--line)}
#tb .tl{display:flex;align-items:center;gap:8px;font:700 13px var(--fh);letter-spacing:-.1px;color:#dfe6ef}#tb .tl svg{width:16px;height:16px;flex:none}
#tb .sp{flex:1}
#tb button{-webkit-app-region:no-drag;width:32px;height:28px;border:0;border-radius:7px;background:none;color:var(--muted);display:grid;place-items:center;padding:0}
#tb button:hover{background:#ffffff14;color:#fff}#tb button.on{color:var(--blue)}#tb button.cl:hover{background:#c42b1c;color:#fff}
#tb button svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
html.desk:not(.full) .dock{position:static;max-width:none;flex:none;margin:0}
html.desk:not(.full) .mini{position:relative;top:auto;left:auto;right:auto;margin:8px 12px 0;height:46px}
html.desk #qa{display:flex;gap:8px;padding:10px 12px 12px;flex:none;border-top:1px solid var(--line);background:#0b1119}
html.desk.full #qa{display:none}
#qa input{height:40px;border-radius:11px;border-color:#ffffff1f;font-size:14px;padding:0 12px}#qa input:focus{border-color:var(--blue);outline:none}
#qa button{width:40px;height:40px;flex:none;border:0;border-radius:11px;background:linear-gradient(105deg,#1f7a4d,#3fae6b);display:grid;place-items:center;padding:0}
#qa svg{width:18px;height:18px;stroke:#fff;stroke-width:2.4;fill:none;stroke-linecap:round}
.desk #toast{top:48px}.desk .al{top:48px}.desk .scrim,.desk .cs{top:40px}
.desk .sheet{max-height:calc(100vh - 52px);border-radius:20px 20px 0 0;padding:16px}
.desk .chip:hover,.desk .ghost:hover{border-color:#ffffff3a}.desk .tx:hover b{color:#fff}
.wh{display:flex;align-items:center;gap:12px;padding:12px 0 6px}.wh .d{flex:1;min-width:0}.wh b{display:block;font:700 17px var(--fh);letter-spacing:-.3px;text-transform:capitalize}
.rg{width:44px;height:44px;position:relative;flex:none}.rg svg{width:44px;height:44px;transform:rotate(-90deg)}.rg span{position:absolute;inset:0;display:grid;place-items:center;font:700 11px var(--fb);font-variant-numeric:tabular-nums}
.rg circle+circle{transition:stroke-dashoffset .5s}
html.desk:not(.full) .t{gap:8px;padding:2px 0}
html.desk:not(.full) .ck{width:34px;height:34px}
html.desk:not(.full) .ck i{width:18px;height:18px;border-radius:6px}
html.desk:not(.full) .tx{min-height:40px}
html.desk:not(.full) .tx b{font-size:13.5px;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
html.desk:not(.full) .tx .m{font-size:11.5px}
html.desk:not(.full) .pr{font-size:0;gap:0}
html.desk:not(.full) summary{min-height:40px}
html.desk:not(.full) .lab{margin-top:12px}
/* ---------- Sin barras ni flechas de desplazamiento (se sigue pudiendo desplazar) ---------- */
*{scrollbar-width:none;-ms-overflow-style:none}
::-webkit-scrollbar{display:none;width:0;height:0}
/* ---------- Sección Hoy en verde (como el Árbol); el check sigue en azul ---------- */
#app.t-hoy .chip.on{background:#16332a;border-color:#4fbf7c;color:#fff}
.dock.t-hoy .fab{background:linear-gradient(105deg,#1f7a4d,#3fae6b);box-shadow:0 8px 24px #2f9a6266}
/* ---------- Móvil: sensación de app nativa ---------- */
#ib,#spl,.grab{display:none}
html:not(.desk){background:#070b11;touch-action:manipulation}
html:not(.desk) body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
html:not(.desk) input{-webkit-user-select:text;user-select:text}
/* Barra superior: fondo tras la hora/batería y título compacto al desplazar, como en iOS */
